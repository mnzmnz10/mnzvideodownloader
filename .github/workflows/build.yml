name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Her main derlemesi yeni bir sürüm olur (ör. 1.2.7): kurulu uygulamalar bunu güncelleme olarak alır
      - name: Sürüm numarasını ayarla
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version --no-git-tag-version --allow-same-version "$base.${{ github.run_number }}"

      - name: Windows kurulum + portable exe oluştur
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mnzvideodownloader-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Sürüm numarasını oku
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # main'e her gönderimde .exe dosyaları Releases sayfasına konur
      # (aynı sürüm numarasıyla tekrar gönderilirse mevcut sürümün dosyaları güncellenir)
      - name: Releases sayfasına yayınla
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MNZ Video Downloader ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          body: |
            ## İndir
            - **mnzvideodownloader-${{ steps.ver.outputs.version }}-setup.exe** — Kurulum programı (masaüstü kısayolu oluşturur)
            - **mnzvideodownloader-${{ steps.ver.outputs.version }}-portable.exe** — Kurulumsuz, tek dosya

            Kurulum sürümü yüklü ise bu güncelleme **otomatik** gelir; tekrar indirmenize gerek yoktur.

            Uygulama imzasız olduğu için Windows SmartScreen uyarı verebilir: **Ek bilgi → Yine de çalıştır**.
